<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReFeel - ログイン</title>
    <link rel="stylesheet" href="../css/useradd_style.css">
</head>
<body>

    <div class="auth-container">
        <h2 class="register-title"></h2>
        <div class="auth-box">

            <!-- ロゴがタイトル扱い（白枠の一番上） -->
            <div class="logo">
                <img src="../img/refeel003.png" alt="ReFeel ロゴ" class="logo-img">
            </div>

            <div class="form-inner">
                <form action="#" method="POST">
                    <!-- メールアドレス -->
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <input type="email" id="email" name="email" value="" required>
                    </div>

                    <!-- パスワード -->
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <input type="password" id="password" name="password" value="" required>
                    </div>

                    <!-- ボタン -->
                    <button type="submit" class="btn btn-primary"><a href="../html/complete.html">ログイン</a></button>
                </form>

                <!-- 登録リンク -->
                <a href="register.html" class="signup-link">新規会員登録はこちら</a>
            </div>
        </div>
    </div>

</body>
</html>
