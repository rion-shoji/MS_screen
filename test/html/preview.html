<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>プレビュー</title>
		<link rel="stylesheet" href="../css/preview.css" />
	</head>
	<body>
		<main class="preview-root">
			<section class="preview-area">
				<!-- ハンバーガーメニュー -->
				<div class="menu-area">
					<button id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="menuDropdown" aria-label="メニュー">
						<span class="hamburger-line"></span>
						<span class="hamburger-line"></span>
						<span class="hamburger-line"></span>
					</button>
					<div id="menuDropdown" class="menu-dropdown" role="menu" aria-hidden="true">
						<button class="menu-item" role="menuitem">再編集</button>
						<button class="menu-item" role="menuitem">破棄</button>
					</div>
				</div>
				<!-- 動画プレースホルダー -->
				<div class="video-wrapper">
					<div class="video-placeholder" id="videoPlaceholder" aria-label="動画プレースホルダー">
						<!-- 動画はここに入る（プレースホルダー） -->
					</div>
				</div>

				<!-- 再生/停止ボタン -->
				<button id="playBtn" class="play-btn" aria-pressed="false" aria-label="再生">
					<span class="icon play-icon" aria-hidden="true"></span>
					<span class="icon pause-icon" aria-hidden="true"></span>
				</button>

				<!-- シークバー群 -->
				<div class="seekbars">
					<!-- 動画のシークバー（固定表示） -->
					<div class="video-seekbar" id="videoSeekbar" title="動画のシークバー"></div>

					<!-- 音楽のシークバー（ドラッグ可能） -->
					<div class="music-seekbar" id="musicSeekbarContainer" aria-label="音楽シークバーコンテナ">
						<div class="music-track" id="musicTrack">
							<div class="music-bar" id="musicBar" title="音楽トラック（ドラッグできます）"></div>
						</div>
					</div>
				</div>

				<div class="actions">
					<button id="exportBtn" class="export-btn">エクスポート</button>
				</div>
			</section>
		</main>

		<script src="../js/preview.js"></script>
	</body>
</html>
