<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真編集画面（トリミング機能付き）</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" 
        integrity="sha512-hvNR0F/e2J7zPPfLC9auFe3/SE0yG4aJCOd/qxew74NN7eyiSKjr7xJJMu1Jy2wf7FXITpWS1E/RY8yzuXN7VA==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="../CSS/test.css">
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="header-title">編集画面+写真追加</div>
            <div class="user-avatars">
                <div class="avatar">A</div>
                <div class="avatar">B</div>
            </div>
        </header>

        <main class="main-content">

            <section class="preview-area">
                <div class="photo-preview">
                    <img id="previewImage" src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?w=800&q=80" alt="プレビュー写真">
                </div>
                <!-- <button id="trimButton" class="trim-button" aria-label="トリミング">✂️</button> -->

                <button class="delete-button" aria-label="削除">🗑️</button>
            </section>

            <aside class="sidebar">
                <div class="menu-header">
                    <span class="menu-info">ハンバーガーメニュー：破棄、途中保存</span>
                    <button class="hamburger-menu" aria-label="メニュー">☰</button>
                </div>
                
                <button id="openModalButton" class="prompt-button">
                    プロンプト
                </button>
                
                <div class="selected-prompts">
                    <p>プロンプト プロンプト プロンプト</p>
                    <p>プロンプト プロンプト プロンプト</p>
                </div>

                <!-- <div class="prompt-group">
                    <label for="textPrompt" class="prompt-label">文章プロンプト</label>
                    <textarea id="textPrompt" class="prompt-textarea" placeholder="ここに文章プロンプトを入力..."></textarea>
                </div> -->
            </aside>
        </main>

        <footer class="photo-strip">
            <div class="thumbnail active" data-src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?w=800&q=80"></div>
            <div class="thumbnail" data-src="https://images.unsplash.com/photo-1503614472-8c93d56e92ce?w=800&q=80"></div>
            <div class="thumbnail" data-src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=800&q=80"></div>
            <div class="thumbnail" data-src="https://images.unsplash.com/photo-1495745966610-2a67f2297e5e?w=800&q=80"></div>
            <div class="thumbnail" data-src="https://images.unsplash.com/photo-1542038784-56e98e014034?w=800&q=80"></div>

            <button class="add-photo-button" aria-label="写真を追加">+</button>
        </footer>

    </div>

    <button class="next-button" aria-label="次へ">→</button>

    <dialog id="promptModal" class="prompt-modal">
        <header class="modal-header">
            モーダル
        </header>
        <section class="modal-body">
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
            <div class="prompt-item">プロンプト</div>
        </section>
        <footer class="modal-footer">
            <button id="closeModalCancel" class="modal-button cancel">キャンセル</button>
            <button id="closeModalOk" class="modal-button ok">OK</button>
        </footer>
    </dialog>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" integrity="sha512-TelkP3PCMJv+viMWynjKcvLsQzx6dJHvIGhfqzFtZKgAjKM1YPqcwzzDEoTc/BHjf43PcPzTQOjuTr4YdE8lNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" integrity="sha512-9KkIqdfN7ipEW6B6k+Aq20PV31bjODg4AA52W+tYtAE0jE0kMx49bjJ3FgvS56wzmyfMUHbQ4Km2b7l9+Y/+Eg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    
    <script src="../js/test.js" defer></script>

</body>
</html>
