<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会員登録確認 | Refeel</title>
  <link rel="stylesheet" href="../css/useradd_style.css">
</head>

<body>
  <div class="auth-container">
    <!-- タイトル（白枠の外） -->
    <h2 class="register-title">会員登録確認</h2>

    <div class="auth-box">
      <div class="form-inner">
        <form action="#" method="post">
          <!-- 名前 -->
          <div class="form-group">
            <label>名前</label>
            <p class="confirm-text">大阪春太郎</p>
          </div>

          <!-- メールアドレス -->
          <div class="form-group">
            <label>メールアドレス</label>
            <p class="confirm-text">halhal@ohs.hal.ac.jp</p>
          </div>

          <!-- 性別 -->
          <div class="form-group">
            <label>性別</label>
            <p class="confirm-text">男性</p>
          </div>

          <!-- 生年月日 -->
          <div class="form-group">
            <label>生年月日</label>
            <p class="confirm-text">2000年 8月 9日</p>
          </div>

          <!-- パスワード -->
          <div class="form-group">
            <label>パスワード</label>
            <p class="confirm-text">osakahalhaltaro</p>
          </div>

          <!-- ボタン -->
          <div class="button-group">
            <button type="button" class="btn btn-secondary" onclick="window.location.href='register.html'">戻る</button>
            <a href="../html/login.html"><button type="submit" class="btn btn-primary">登録</button></a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
