<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />

  <title>新規プロジェクト | ReFeel</title>
  <link rel="stylesheet" href="../css/newproject.css" />
</head>

<!-- ユーザーID -->

<body>
  <main class="page">
    <section class="card">
      <!-- パンくず -->
      <nav class="breadcrumb" aria-label="パンくず">
        <a href="#" class="breadcrumb__link">ホーム</a>
        <span class="breadcrumb__sep">›</span>
        <a href="#" class="breadcrumb__link"><strong>新規作成</strong></a>
        <span class="breadcrumb__sep">›</span>
        <a href="#" class="breadcrumb__link">写真選択</a>
        <span class="breadcrumb__sep">›</span>
        <span class="breadcrumb__current">音楽選択</span>
      </nav>

      <!-- 見出し帯 -->
      <header class="hero">
        <h1 class="hero__title">新規プロジェクト</h1>
      </header>

      <!-- 本文フォーム -->
      <form class="form" action="#" method="post" novalidate>
        <!-- プロジェクト名 -->
        <div class="form__group">
          <label for="projectName" class="form__label">プロジェクト名</label>
          <input id="projectName" name="projectName" class="input" placeholder="NEWPROJECT_1010" />
        </div>

        <!-- 動画の長さ -->
        <div class="form__group">
          <div class="form__row">
            <span class="form__label">動画の長さ</span>
            <span class="meta">必要写真数：◯枚</span>
          </div>
          <div class="btnset">
            <button type="button" class="btn btn--chip is-active" aria-pressed="true">30秒</button>
            <button type="button" class="btn btn--chip">60秒</button>
            <button type="button" class="btn btn--chip">90秒</button>
          </div>
        </div>

        <!-- 用途 -->
        <div class="form__group">
          <label class="form__label">用途</label>
          <div class="btnwrap">
            <button type="button" class="btn btn--tag">自分の結婚式</button>
            <button type="button" class="btn btn--tag">誕生日ギフト</button>
            <button type="button" class="btn btn--tag">旅行</button>
            <button type="button" class="btn btn--tag">卒業アルバム</button>
            <button type="button" class="btn btn--tag">その他</button>
          </div>
        </div>

        <!-- アクション -->
        <div class="form__actions">
          <button type="button" class="btn btn--ghost">キャンセル</button>
          <button type="submit" class="btn btn--primary"><a href="../html/newproject_photo02.html">作成</a></button>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
