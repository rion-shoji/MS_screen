<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Selection</title>
    <link rel="stylesheet" href="../css/music_generation.css">
</head>

<body>
    <div class="container">
        <nav class="breadcrumb" aria-label="パンくず">
            <a href="../html/home.html" class="breadcrumb__link">ホーム</a>
            <span class="breadcrumb__sep">›</span>
            <a href="../html/newproject_mode01.html" class="breadcrumb__link">新規作成</a>
            <span class="breadcrumb__sep">›</span>
            <a href="../html/newproject_photo02.html" class="breadcrumb__link">写真選択</a>
            <span class="breadcrumb__sep">›</span>
            <a href="../html/newproject_musicoption03.html" class="breadcrumb__link">音楽オプション</a>
            <span class="breadcrumb__sep">›</span>
            <span class="breadcrumb__current"><strong>音楽選択</strong></span>
        </nav>
        <h1>オリジナル音楽の提案</h1>
        <div class="music-options">
            <div class="music-card">
                <h3>オリジナル #01</h3>
                <p>アップテンポ / 呪ろい</p>
                <div class="waveform">
                    <div class="waveform">
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                    </div>
                </div>
                <div>
                    <button class="play-button">▶ 聴</button>
                </div>
                <label class="radio-button">
                    <input type="radio" name="music" value="1" checked>
                    この曲を使う
                </label>
            </div>
            <div class="music-card">
                <h3>オリジナル #02</h3>
                <p>しっとり / 騒励 0:30</p>
                <div class="waveform">
                    <div class="waveform">
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                    </div>
                </div>
                <div>
                    <button class="play-button">▶ 聴</button>
                </div>
                <label class="radio-button">
                    <input type="radio" name="music" value="2">
                    この曲を使う
                </label>
            </div>
            <div class="music-card">
                <h3>オリジナル #03</h3>
                <p>おだやか / 軽快 0:30</p>
                <div class="waveform">
                    <div class="waveform">
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                        <div class="waveform-bar"></div>
                    </div>
                </div>
                <div>
                    <button class="play-button">▶ 聴</button>
                </div>
                <label class="radio-button">
                    <input type="radio" name="music" value="3">
                    この曲を使う
                </label>
            </div>
        </div>
        <div class="actions">
            <button class="back-button">もどる</button>
            <button class="generate-button"><a href="../html/newproject_preview04.html">動画生成</a></button>
        </div>
    </div>
</body>

</html>
