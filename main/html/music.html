<!-- music.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>音楽選択 | ReFeel</title>
  <link rel="stylesheet" href="../CSS/newproject.css" />
</head>
<body>
  <main class="page">
    <section class="card music">
      <!-- パンくず -->
      <nav class="breadcrumb" aria-label="パンくず">
        <a href="#" class="breadcrumb__link">ホーム</a>
        <span class="breadcrumb__sep">›</span>
        <a href="#" class="breadcrumb__link">新規作成</a>
        <span class="breadcrumb__sep">›</span>
        <a href="#" class="breadcrumb__link">写真選択</a>
        <span class="breadcrumb__sep">›</span>
        <span class="breadcrumb__current"><strong>音楽選択</strong></span>
      </nav>

      <!-- 閉じる -->
      <button class="music__close" aria-label="閉じる">閉じる×</button>

      <!-- タブと説明 -->
      <div class="music__header">
        <div class="tabs">
          <button class="tab is-active" aria-pressed="true">AI生成</button>
          <button class="tab">おすすめ</button>
        </div>
        <p class="helper">
          <strong>AI生成：</strong>あなたの要望に合わせてあなただけのオリジナルソングを生成<br />
          <strong>おすすめ：</strong>既存の音源から好みや雰囲気を選択
        </p>
      </div>

      <!-- 2カラム -->
      <div class="music__grid">
        <!-- 左：フォーム -->
        <form class="music__form" action="#" method="post" novalidate>
          <!-- ムード -->
          <div class="form__group">
            <label class="form__label">ムード</label>
            <div class="chipset">
              <button type="button" class="chip is-active">アップテンポ</button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
            </div>
          </div>

          <!-- テンポ -->
          <div class="form__group">
            <label class="form__label">テンポ</label>
            <div class="chipset">
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
            </div>
          </div>

          <!-- 楽器 -->
          <div class="form__group">
            <label class="form__label">楽器</label>
            <div class="chipset">
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
              <button type="button" class="chip"></button>
            </div>
          </div>

          <!-- プロンプト -->
          <div class="form__group">
            <label class="form__label">プロンプト</label>
            <textarea class="textarea" rows="6" placeholder=""></textarea>
          </div>

          <!-- 下部ボタン -->
          <div class="music__actions">
            <button type="button" class="btn btn--ghost btn--danger-lite">もどる</button>
            <button type="submit" class="btn btn--primary">動画生成</button>
          </div>
        </form>

        <!-- 右：キューポイント -->
        <aside class="cue">
          <h2 class="cue__title">キューポイント</h2>
          <div class="cue__box" aria-hidden="true"></div>
        </aside>
      </div>
    </section>
  </main>
</body>
</html>
