<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Videos</title>
    <link rel="stylesheet" href="../../css/user.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <!-- Placeholder for logo icon -->
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="15" cy="15" r="14" stroke="white" stroke-width="2"/>
                        <circle cx="10" cy="10" r="5" fill="white"/>
                        <circle cx="20" cy="10" r="5" fill="white"/>
                        <circle cx="15" cy="20" r="5" fill="white"/>
                    </svg>
                </div>
                <h2 class="app-title">ReFeel 管理</h2>
            </div>
            <nav class="nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="admin_home.html">
                            <span class="icon">🏠</span> <!-- Dashboard Icon -->
                            <span>ホーム</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="admin_.html">
                            <span class="icon">👨‍💼</span> <!-- Teachers Icon -->
                            <span>管理者</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="admin_userlist.html">
                            <span class="icon">👥</span> <!-- User Icon -->
                            <span>顧客</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="admin_report.html">
                            <span class="icon">💰</span> <!-- Billing Icon -->
                            <span>統計</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#settings">
                            <span class="icon">⚙️</span> <!-- Settings Icon -->
                            <span>設定</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#features">
                            <span class="icon">✨</span> <!-- Features Icon -->
                            <span>特徴</span>
                            <span class="new-badge">NEW</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header-bar">
                <div class="breadcrumbs">
                    Users > <span class="user-name">山本由美子</span> > 動画
                </div>
                <div class="header-actions">
                    <span class="notification-icon">🔔</span> <!-- Notification Icon -->
                    <button id="logout-button" class="logout-button"><a href="../admin/admin_login.html">ログアウト</a></button>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="top-actions">
                    <button id="export-csv-button" class="btn btn-secondary">CSVエクスポート</button>
                    <!-- In this context, "Add Student" might be a misnomer or generic button; based on screenshot it's "Add Student" -->
                    <button id="add-student-button" class="btn btn-primary">ユーザーを追加</button>
                </div>

                <div class="search-filter-bar">
                    <div class="filter-dropdown">
                        <select name="filter" id="filter-select">
                            <option value="all">フィルターを追加</option>
                            <option value="title">タイトル</option>
                            <option value="duration">間隔</option>
                            <option value="created">作成</option>
                            <option value="status">状態</option>
                        </select>
                    </div>
                    <div class="search-input-container">
                        <span class="search-icon">🔍</span> <!-- Search Icon -->
                        <input type="text" id="search-input" placeholder="Search videos">
                    </div>
                </div>

                <div class="main-content-area">
                    <div class="video-list-section">
                        <table class="video-table">
                            <thead>
                                <tr>
                                    <th></th> <!-- Thumbnail Placeholder -->
                                    <th>タイトル</th>
                                    <th>間隔</th>
                                    <th>作成</th>
                                    <th>状態</th>
                                    <th>旗</th>
                                </tr>
                            </thead>
                            <tbody id="video-table-body">
                                <!-- Video rows will be populated here -->
                                <tr data-video-id="1">
                                    <td><div class="thumbnail-placeholder"></div></td>
                                    <td>春次郎の運動会</td>
                                    <td>3:45</td>
                                    <td>2025/06/01</td>
                                    <td><span class="status-badge published">Published</span></td>
                                    <td><span class="flag-icon"></span></td>
                                </tr>
                                <tr data-video-id="2">
                                    <td><div class="thumbnail-placeholder"></div></td>
                                    <td>NewProject0612</td>
                                    <td>5:20</td>
                                    <td>2025/06/12</td>
                                    <td><span class="status-badge published">Published</span></td>
                                    <td><span class="flag-icon"></span></td>
                                </tr>
                                <tr data-video-id="3" class="selected">
                                    <td><div class="thumbnail-placeholder"></div></td>
                                    <td>NewProject0709</td>
                                    <td>4:15</td>
                                    <td>2025/07/09</td>
                                    <td><span class="status-badge draft">Draft</span></td>
                                    <td><span class="flag-icon"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div id="video-details-panel" class="video-details-panel">
                        <!-- Details content will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/user.js"></script>
</body>
</html>
