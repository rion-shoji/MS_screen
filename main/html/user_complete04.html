<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録完了 - ReFeel</title>
    <link rel="stylesheet" href="../css/useradd_style.css">
</head>
<body>
    <div class="auth-container">
         <h2 class="register-title"></h2>
        <div class="auth-box">
            
            <p class="welcome-message">
                ようこそ、<span class="username" id="display-name">ユーザー</span>さん
            </p>

            <div class="logo">
                <img src="../img/refeel003.png" alt="ReFeel Logo" class="logo-img-w">
            </div>
            
            <a href="../html/home.html"><button type="button" class="btn btn-start">
                はじめる
            </button>
            </a>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // sessionStorageに保存された「ログイン中のユーザー名」を取得
            const userName = sessionStorage.getItem('userName');
            
            if (userName) {
                document.getElementById('display-name').textContent = userName + 'さん';
            }
        });
    </script>
</body>
</html>
