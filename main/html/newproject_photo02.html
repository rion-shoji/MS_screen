<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真編集画面（トリミング機能付き）</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" 
        integrity="sha512-hvNR0F/e2J7zPPfLC9auFe3/SE0yG4aJCOd/qxew74NN7eyiSKjr7xJJMu1Jy2wf7FXITpWS1E/RY8yzuXN7VA==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="../CSS/edit_screen.css">
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="header-title">編集画面+写真追加</div>
            <div class="user-avatars">
                <div class="avatar">A</div>
                <div class="avatar">B</div>
            </div>
        </header>

        <main class="main-content">

            <section class="preview-area">
                <div class="photo-preview">
                    <img id="previewImage" src="../img/test_img_01.jpg" alt="プレビュー写真">
                </div>
                
                <button id="trimButton" class="trim-button" aria-label="トリミング">✂️</button>
                <button class="delete-button" aria-label="削除">🗑️</button>
            </section>

           <aside class="sidebar">
                <div class="menu-header">
                    <span class="menu-info">ハンバーガーメニュー：破棄、途中保存</span>
                    <button class="hamburger-menu" aria-label="メニュー">☰</button>
                </div>
                
                <div class="prompt-input-container">
                    <button id="openModalButton" class="prompt-button">
                        プロンプト
                    </button>
                    <textarea id="promptTextarea" class="prompt-textarea" placeholder="ここにプロンプトを入力してください..."></textarea>
                </div>
                
                <div class="selected-prompts">
                    <p></p>
                    <p></p>
                </div>
            </aside>
        </main>

        <footer class="photo-strip">
            <div class="thumbnail active" data-src="../img/test_img_01.jpg"></div>
            <div class="thumbnail" data-src="../img/test_img_02.jpg"></div>
            <div class="thumbnail" data-src="../img/test_img_03.jpg"></div>
            <div class="thumbnail" data-src="../img/test_img_04.jpg"></div>
            <div class="thumbnail" data-src="../img/test_img_05.jpg"></div>
            <div class="thumbnail" data-src="../img/test_img_06.jpg"></div>

            <button class="add-photo-button" aria-label="写真を追加">+</button>
        </footer>
        </div>

    <button class="next-button" aria-label="次へ"><a href="../html/newproject_music03.html">→</button>

    <dialog id="promptModal" class="prompt-modal">
        <header class="modal-header">
            モーダル
        </header>
        <section class="modal-body">
            </section>
        <footer class="modal-footer">
            <button id="closeModalCancel" class="modal-button cancel">キャンセル</button>
            <button id="closeModalOk" class="modal-button ok">OK</button>
        </footer>
    </dialog>


    <dialog id="trimModal" class="trim-modal">
        <header class="modal-header">
            トリミング
        </header>
        <section class="trim-modal-body">
            <div class="trim-image-container">
                <img id="trimModalImage" src="">
            </div>
        </section>
        <footer class="modal-footer">
            <button id="trimRotateLeft" class="modal-button rotate">⟲ 左回転</button>
            <button id="trimRotateRight" class="modal-button rotate">⟳ 右回転</button>
            <button id="trimCancelButton" class="modal-button cancel">キャンセル</button>
            <button id="trimApplyButton" class="modal-button ok">適用</button>
        </footer>
    </dialog>
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js" integrity="sha512-TelkP3PCMJv+viMWynjKcvLsQzx6dJHvIGhfqzFtZKgAjKM1YPqcwzzDEoTc/BHjf43PcPzTQOjuTr4YdE8lNQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js" integrity="sha512-9KkIqdfN7ipEW6B6k+Aq20PV31bjODg4AA52W+tYtAE0jE0kMx49bjJ3FgvS56wzmyfMUHbQ4Km2b7l9+Y/+Eg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    
    
    <script src="../js/edit_screen.js"></script>

</body>
</html>
